# Factory: builds Linear tickets and reviews PRs. Managed from kverburg/factory
# (templates/app-repo/.github/workflows/factory.yml).
name: Factory

on:
  repository_dispatch:
    # factory-build: sent by the relay when a Linear issue moves to "Agent Ready".
    # factory-fix:   sent by the reviewer when it wants the builder to fix its PR, by the relay when
    #                Koen comments "change …" on the ticket (payload requested=true: not counted as a round),
    #                or by the update job to resolve merge conflicts (payload conflict=true: not counted either),
    #                or by the stuck check to continue a ticket whose run died.
    # factory-approve: sent by the relay when Koen comments "approve" or "merge" on the ticket.
    # factory-review: sent by the stuck check (KV-73) for an agent PR whose review never gave a verdict.
    types: [factory-build, factory-fix, factory-approve, factory-review]
  # PRs you open yourself get the same review (but are never changed automatically).
  # The factory's own PRs are already reviewed by the build run. They are recognised by their author (a bot: the
  # factory app) and not only by the label agent-built, because `gh pr create --label` adds the label after the
  # PR is opened, so the `opened` event doesn't carry it yet (KV-85).
  pull_request:
    types: [opened, reopened, ready_for_review]
  # The base branch moved: agent PRs are brought up to date, conflicts go to the builder (KV-49).
  push:
    branches: [main]
  # A check that fails after the review (e.g. a slow Cloudflare build) gets an agent PR reviewed again.
  check_run:
    types: [completed]

# Dispatch runs are named after their ticket, so the stuck check can tell which runs belong to which ticket.
run-name: ${{ github.event.client_payload.identifier && format('Factory {0}', github.event.client_payload.identifier) || github.event.pull_request.title || 'Factory' }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: factory-${{ github.event.client_payload.identifier || github.event.pull_request.number || (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure' && github.event.check_run.pull_requests[0].number) || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'repository_dispatch' && github.event.action != 'factory-approve' && github.event.action != 'factory-review'
    uses: kmverburg/factory/.github/workflows/build.yml@main
    secrets: inherit

  # Koen approved the PR from its Linear ticket: merge it once the required checks pass (agents/approve/approve.sh).
  approve:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'factory-approve'
    uses: kmverburg/factory/.github/workflows/approve.yml@main
    with:
      pr_number: ${{ github.event.client_payload.pr_number }}
      identifier: ${{ github.event.client_payload.identifier }}
    secrets: inherit

  # A failed check on an open agent PR: cancels auto-merge, skips the factory's own checks and
  # PRs that are already being fixed (see agents/review/recheck.sh).
  recheck:
    if: github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure'
    uses: kmverburg/factory/.github/workflows/recheck.yml@main
    with:
      check_name: ${{ github.event.check_run.name }}
      head_sha: ${{ github.event.check_run.head_sha }}
      pr_number: ${{ github.event.check_run.pull_requests[0].number && format('{0}', github.event.check_run.pull_requests[0].number) || '' }}

  review:
    needs: [build, recheck]
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.user.type != 'Bot' &&
        !contains(github.event.pull_request.labels.*.name, 'agent-built')) ||
       needs.build.outputs.pr_number != '' || needs.recheck.outputs.pr_number != '' ||
       github.event.action == 'factory-review')
    uses: kmverburg/factory/.github/workflows/review.yml@main
    with:
      pr_number: ${{ needs.build.outputs.pr_number || needs.recheck.outputs.pr_number || github.event.client_payload.pr_number || github.event.pull_request.number }}
      fix_round: ${{ github.event.client_payload.round || needs.recheck.outputs.fix_round || '0' }}
    secrets: inherit

  # Keeps agent PRs up to date with main: after a push to main, and after a review (main may have moved while
  # it ran, and an auto-merge must not merge an out-of-date PR). See agents/update/update.sh.
  update:
    needs: [build, recheck, review]
    if: >-
      always() && (github.event_name == 'push' ||
        (needs.review.result == 'success' && (needs.build.outputs.pr_number != '' || needs.recheck.outputs.pr_number != '' || github.event_name == 'pull_request')))
    uses: kmverburg/factory/.github/workflows/update.yml@main
    with:
      base_branch: ${{ github.event_name == 'push' && github.ref_name || '' }}
      pr_number: ${{ github.event_name != 'push' && format('{0}', needs.build.outputs.pr_number || needs.recheck.outputs.pr_number || github.event.pull_request.number) || '' }}
    secrets: inherit
