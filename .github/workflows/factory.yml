# Factory: builds Linear tickets and reviews PRs. Managed from kverburg/factory
# (templates/app-repo/.github/workflows/factory.yml).
name: Factory

on:
  repository_dispatch:
    # factory-build: sent by the relay when a Linear issue moves to "Agent Ready".
    # factory-fix:   sent by the reviewer when it wants the builder to fix its PR.
    types: [factory-build, factory-fix]
  # PRs you open yourself get the same review (but are never changed automatically).
  # The factory's own PRs (label agent-built) are already reviewed by the build run.
  pull_request:
    types: [opened, reopened, ready_for_review]
  # A check that fails after the review (e.g. a slow Cloudflare build) gets an agent PR reviewed again.
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: factory-${{ github.event.client_payload.identifier || github.event.pull_request.number || (github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure' && github.event.check_run.pull_requests[0].number) || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'repository_dispatch'
    uses: kmverburg/factory/.github/workflows/build.yml@main
    secrets: inherit

  # A failed check on an open agent PR: cancels auto-merge, skips the factory's own checks and
  # PRs that are already being fixed (see agents/review/recheck.sh).
  recheck:
    if: github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure'
    uses: kmverburg/factory/.github/workflows/recheck.yml@main
    with:
      check_name: ${{ github.event.check_run.name }}
      head_sha: ${{ github.event.check_run.head_sha }}
      pr_number: ${{ github.event.check_run.pull_requests[0].number && format('{0}', github.event.check_run.pull_requests[0].number) || '' }}

  review:
    needs: [build, recheck]
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'agent-built')) ||
       needs.build.outputs.pr_number != '' || needs.recheck.outputs.pr_number != '')
    uses: kmverburg/factory/.github/workflows/review.yml@main
    with:
      pr_number: ${{ needs.build.outputs.pr_number || needs.recheck.outputs.pr_number || github.event.pull_request.number }}
      fix_round: ${{ github.event.client_payload.round || needs.recheck.outputs.fix_round || '0' }}
    secrets: inherit
